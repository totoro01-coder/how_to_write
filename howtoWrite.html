<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>읽는 방</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 읽는 방: 하얀 종이에 별색 평면 도형, 가는 괘선, 담백한 글자 (한글은 Noto Sans KR 하나).
   인물=금 · 사건=주황 · 배경=초록이 카드, 칸, 쌓은 이야기 전부에서 같은 뜻으로 쓰여요. UI 포인트는 파랑, 흔적은 보라.
   그림 안의 색(--gx-*)은 라이트/다크에서 같아요. 인쇄된 카드처럼. */
:root{
  --bg:#FFFFFF; --surface:#F5F6F6; --surface-2:#E8EBEC; --table:#F0F2F2; --ink:#16181B; --ink-2:#464C52; --ink-3:#656B72;
  --line:#D3D7DA; --line-strong:#A9AFB4; --rule:#16181B;
  --accent:#0B6FA6; --accent-ink:#FFFFFF; --accent-soft:#DDEEF8;
  --sp0:#86600F; --sp1:#AE510A; --sp2:#1B7437;
  --sp0-t:#F5EAD0; --sp1-t:#FBE5D3; --sp2-t:#D9EEDF;
  --bad:#B3341E; --bad-t:#FADDD6; --good:#1B7437; --good-t:#D9EEDF; --trace:#5A3EB3; --trace-t:#E8E1F7;
  --scrim:rgba(16,18,20,.5); --dist-field:#15171A;
  --gx-ink:#15171A; --gx-paper:#FFFFFF; --gx-gold:#C08F2B; --gx-orange:#F07C28; --gx-green:#2E9B4F;
  --gx-blue:#2AABE2; --gx-yellow:#F5CE26; --gx-purple:#7B5BD0; --gx-red:#E4472C;
  --back:radial-gradient(rgba(255,255,255,.26) 1.1px, transparent 1.5px) 0 0/6px 6px, #15171A;
  --font-body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D0E10; --surface:#16181B; --surface-2:#202327; --table:#17191C; --ink:#EEF0F1; --ink-2:#B4B9BE; --ink-3:#8D9399;
    --line:#30343A; --line-strong:#5B6168; --rule:#EEF0F1;
    --accent:#5DBDEB; --accent-ink:#06202F; --accent-soft:#16303F;
    --sp0:#E4B552; --sp1:#F59D58; --sp2:#62C47F;
    --sp0-t:#2D2512; --sp1-t:#33200F; --sp2-t:#12281A;
    --bad:#F28B76; --bad-t:#3A1F19; --good:#62C47F; --good-t:#12281A; --trace:#B39DF2; --trace-t:#271F42;
    --scrim:rgba(0,0,0,.66); --dist-field:#2B3038;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0E10; --surface:#16181B; --surface-2:#202327; --table:#17191C; --ink:#EEF0F1; --ink-2:#B4B9BE; --ink-3:#8D9399;
  --line:#30343A; --line-strong:#5B6168; --rule:#EEF0F1;
  --accent:#5DBDEB; --accent-ink:#06202F; --accent-soft:#16303F;
  --sp0:#E4B552; --sp1:#F59D58; --sp2:#62C47F;
  --sp0-t:#2D2512; --sp1-t:#33200F; --sp2-t:#12281A;
  --bad:#F28B76; --bad-t:#3A1F19; --good:#62C47F; --good-t:#12281A; --trace:#B39DF2; --trace-t:#271F42;
  --scrim:rgba(0,0,0,.66); --dist-field:#2B3038;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.6;
  padding-block:18px 72px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
html.lock{overflow:hidden}
.wrap{max-width:1040px; margin:0 auto}
h1,h2,h3{font-weight:700; margin:0; text-wrap:balance}
h2{font-size:20px; letter-spacing:-0.02em}
h3{font-size:14.5px}
p{margin:0}
.help{color:var(--ink-2); font-size:13.5px; max-width:62ch; margin-top:5px; word-break:keep-all}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
[hidden]{display:none!important}

/* 그림 공통 */
.gx{display:block; max-width:100%}
.k-fg{fill:var(--ink)} .s-fg{stroke:var(--ink)} .k-dist{fill:var(--dist-field)} .k-ink{fill:var(--gx-ink)} .k-paper{fill:var(--gx-paper)} .k-gold{fill:var(--gx-gold)} .k-orange{fill:var(--gx-orange)}
.k-green{fill:var(--gx-green)} .k-blue{fill:var(--gx-blue)} .k-yellow{fill:var(--gx-yellow)} .k-purple{fill:var(--gx-purple)} .k-red{fill:var(--gx-red)}
.s-line{fill:none; stroke:var(--gx-paper); stroke-width:4; stroke-linecap:round; stroke-linejoin:round}
.s-ink{stroke:var(--gx-ink); stroke-width:2}
.gl-ink{fill:var(--ink)} .gl-bg{fill:var(--bg)} .gl-line{stroke:var(--ink); stroke-width:1.8}
.g-ent{display:inline-block; vertical-align:-3px; flex:none}

/* 버튼과 입력 */
.btn{background:var(--accent); color:var(--accent-ink); border:1px solid var(--accent); border-radius:999px; padding:9px 22px; font-weight:600; cursor:pointer}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--ink-3)}
.btn.sm{padding:4px 14px; font-size:13px; font-weight:500}
.btn.big{padding:13px 34px; font-size:17px}
.btnrow{display:flex; flex-wrap:wrap; gap:8px 10px; margin-top:14px; align-items:center}
input.txt,textarea{background:transparent; color:var(--ink); border:0; border-bottom:1px solid var(--ink-3); border-radius:0; padding:4px 2px; font:inherit; min-width:0}
input.txt{width:100%}
input.txt:focus-visible,textarea:focus-visible{outline:none; border-bottom-color:var(--accent); box-shadow:0 1px 0 var(--accent)}
textarea{width:100%; min-height:120px; font-size:13px; border:1px solid var(--line-strong); padding:8px}
.toggle{display:inline-flex; gap:8px; align-items:center; font-size:14px; cursor:pointer}
.toggle input{width:16px; height:16px; accent-color:var(--accent)}
.sq{display:inline-block; width:10px; height:10px; margin-right:7px; vertical-align:baseline}
.sp0c{background:var(--sp0)} .sp1c{background:var(--sp1)} .sp2c{background:var(--sp2)}

/* 위쪽 줄 */
.bar{display:flex; justify-content:space-between; align-items:center; gap:12px; padding-bottom:12px; border-bottom:1px solid var(--rule)}
.brand{display:inline-flex; align-items:center; gap:10px; font-weight:700; font-size:19px; letter-spacing:-0.03em}
.brand .mk{display:inline-flex; gap:3px}
.brand .mk i{width:9px; height:15px; border-radius:2px; display:block}
.brand .mk i:nth-child(1){background:var(--gx-gold)} .brand .mk i:nth-child(2){background:var(--gx-orange)} .brand .mk i:nth-child(3){background:var(--gx-green)}
.bar nav{display:flex; gap:8px}

/* 제목 화면 */
.hero{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,460px); gap:20px 40px; align-items:center; padding:34px 0 8px}
.hero h1{font-size:clamp(56px,10vw,96px); letter-spacing:-0.06em; line-height:1}
.lead{font-size:17px; max-width:27ch; margin-top:20px; color:var(--ink-2); word-break:keep-all; line-height:1.7}
.hero .btnrow{margin-top:26px}
.hero .resume{font-size:13px; color:var(--ink-2)}
.fan{display:flex; justify-content:center; padding:24px 0 8px}
.fcard{position:relative; width:32%; max-width:172px; margin-inline:-0.5%; border:1px solid var(--line-strong); border-radius:14px; background:var(--bg); padding:7px; display:flex; flex-direction:column; gap:6px; box-shadow:0 8px 0 -4px var(--surface-2)}
.fcard .gx{width:100%; height:auto}
.fcard span{font-size:12.5px; font-weight:600; padding:0 2px 2px}
.fcard{transform:translateY(var(--ty,0px)) rotate(var(--r,0deg))}
.fcard:nth-child(1){--r:-6deg; --ty:8px} .fcard:nth-child(2){--r:0deg; --ty:-6px; z-index:2} .fcard:nth-child(3){--r:6deg; --ty:8px}
.how{margin-top:44px; border-top:1px solid var(--rule); list-style:none; padding:0}
.how li{display:grid; grid-template-columns:128px minmax(0,1fr); gap:6px 22px; padding:18px 0; border-bottom:1px solid var(--line); align-items:center}
.how li .gx{width:100%; height:auto}
.how .art{display:flex; gap:6px}
.how .art .gx{flex:1; min-width:0}
.how .art.col{flex-direction:column; justify-content:center}
.how .art.col .gx{flex:none}
.how h3{font-size:16.5px; letter-spacing:-0.02em}
.how p{font-size:14px; color:var(--ink-2); max-width:58ch; margin-top:4px; word-break:keep-all}
.how p b{color:var(--ink)}
details.rulebox,details.seedbox{margin-top:22px; border-top:1px solid var(--rule); border-bottom:1px solid var(--line); padding:2px 0 14px}
details > summary{cursor:pointer; font-weight:600; padding:10px 0}
details.seedbox .btnrow{margin-top:8px}

/* 규칙 설명 */
.rules-body h3{font-size:14.5px; margin-top:16px}
.rules-body p{font-size:14px; color:var(--ink-2); max-width:66ch; margin-top:6px; word-break:keep-all}
.rules-body ul{margin:6px 0 0; padding-left:1.2em; font-size:14px; color:var(--ink-2); max-width:66ch}
.rules-body li{margin-bottom:4px; word-break:keep-all}
.rules-body b{color:var(--ink)}

/* 장르·설정 고르기 */
.step{padding-top:26px}
.step .btnrow{margin-top:20px}
.genre-row{display:flex; flex-wrap:wrap; gap:16px; margin-top:20px}
.genre{position:relative; width:212px; border:1px solid var(--line-strong); border-radius:14px; background:var(--bg); padding:10px 14px 14px; text-align:left; cursor:pointer; display:flex; flex-direction:column; gap:6px}
.genre .gx{width:100%; height:100px; margin:6px 0}
.genre b{font-size:24px; font-weight:700; letter-spacing:-0.03em; display:block}
.genre .gi{display:block; font-size:12.5px; color:var(--ink-2); line-height:1.5; word-break:keep-all}
.genre:hover{border-color:var(--ink)}
.setting-row{display:flex; flex-wrap:wrap; gap:16px; margin-top:20px}
.setting{position:relative; width:268px; border:1px solid var(--line-strong); border-radius:14px; background:var(--bg); padding:13px 15px 15px; text-align:left; cursor:pointer}
.setting:hover{border-color:var(--ink)}
.setting[aria-pressed="true"]{border-color:var(--accent); outline:2px solid var(--accent); outline-offset:1px; background:var(--accent-soft)}
.setting b{font-size:16px; font-weight:700; letter-spacing:-0.02em; display:block; margin-bottom:8px; line-height:1.4}
.setting span{display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--ink-2); line-height:1.5; padding:2px 0}
.setting span em{font-style:normal; color:var(--ink); font-weight:700; display:inline-flex; align-items:center; gap:4px; min-width:2.7em}
.names{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px 20px; margin-top:22px; max-width:780px}
.names label{font-size:13px; color:var(--ink-2); display:block}
.names input{margin-top:2px}

/* 점수·덱 */
.status{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px 30px; margin-top:20px}
.stat .k{font-size:12.5px; color:var(--ink-3); display:flex; justify-content:space-between}
.stat .v{font-size:26px; font-weight:700; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; line-height:1.25}
.stat .v.sm{font-size:20px}
.meter{height:10px; background:var(--surface-2); margin-top:5px; position:relative; overflow:hidden}
.meter > i{display:block; height:100%; background:var(--accent)}
.meter.deck > i{background:var(--ink)}
.meter::after{content:""; position:absolute; inset:0; background:repeating-linear-gradient(90deg, transparent 0 calc(10% - 2px), var(--bg) calc(10% - 2px) 10%)}
.cast{margin-top:18px; padding:10px 0 12px; border-top:1px solid var(--rule); border-bottom:1px solid var(--line)}
.cast .premise{font-weight:700; font-size:17px; letter-spacing:-0.02em}
.cast-items{display:flex; flex-wrap:wrap; gap:6px 24px; margin-top:8px; font-size:13.5px; color:var(--ink-2)}
.cast-items > span{display:inline-flex; align-items:center; gap:6px}
.cast-items b{font-size:14px; color:var(--ink); font-weight:700}
.cast-items .nm{color:var(--ink); font-weight:600}

/* 탁자: 덱과 버린 카드, 지금 자리, 쌓은 이야기 */
.table{display:grid; grid-template-columns:auto 236px minmax(0,1fr); gap:16px 26px; background:var(--table); border-radius:18px; padding:18px; margin-top:20px; align-items:start}
.piles{display:flex; gap:14px; align-items:flex-start}
.pile{position:relative; width:78px; height:108px; border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; isolation:isolate}
.pile b{font-size:25px; font-weight:700; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; line-height:1}
.pile span{font-size:11.5px; margin-top:5px}
.pile.deck{background:var(--back); color:#fff; box-shadow:inset 0 0 0 4px var(--gx-ink), inset 0 0 0 5px rgba(255,255,255,.45)}
.pile.deck::before,.pile.deck::after{content:""; position:absolute; inset:0; border-radius:12px; background:var(--gx-ink); z-index:-1; border:1px solid rgba(255,255,255,.3)}
.pile.deck::before{transform:translate(3px,3px)} .pile.deck::after{transform:translate(6px,6px)}
.pile.deck b,.pile.deck span{background:var(--gx-ink); padding:2px 8px; border-radius:6px}
.pile.deck.low b{color:#FFB4A6}
.pile.out{border:1.5px dashed var(--line-strong); color:var(--ink-2)}
.pile.out.some{border-style:solid; background:var(--bg)}
.seat-slot .zt,.strip .zt{font-size:13px; font-weight:700; margin-bottom:8px}
.seatcard{width:100%; max-width:236px; border:1px solid var(--line-strong); border-radius:14px; background:var(--bg); padding:8px; display:flex; flex-direction:column; gap:4px}
.seatcard .gx{width:100%; height:auto; margin-bottom:4px}
.seatcard .nm{font-size:17px; letter-spacing:-0.02em; font-weight:700}
.seatcard .ln{font-size:12.5px}
.seatcard.sp0 .ln{color:var(--sp0)} .seatcard.sp1 .ln{color:var(--sp1)} .seatcard.sp2 .ln{color:var(--sp2)}
.seatcard .reads{display:flex; align-items:center; gap:3px; font-size:12px; color:var(--ink-2); margin-top:2px}
.seatcard .reads i{width:10px; height:10px; border:1.5px solid currentColor; display:block}
.seatcard .reads i.on{background:currentColor}
.seatcard .reads i.over{background:var(--bad); border-color:var(--bad)}
.seatcard .reads span{margin-left:6px}
.seatcard.ghost{border:1.5px dashed var(--line-strong); background:transparent; min-height:156px; align-items:center; justify-content:center; text-align:center; color:var(--ink-3); font-size:13.5px}
.seat-slot .pp{font-size:12.5px; color:var(--ink-2); margin-top:8px; max-width:236px; word-break:keep-all}
.seat-slot .full{font-size:12.5px; color:var(--bad); font-weight:600; margin-top:6px; max-width:236px; word-break:keep-all}
.chip{display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line-strong); border-radius:999px; padding:2px 11px; font-size:13px; background:var(--bg)}
.chip.trace{border-color:var(--trace); background:var(--trace-t); color:var(--trace); font-weight:600}
.trace-note{font-size:12.5px; color:var(--ink-2); margin-top:6px; max-width:62ch; word-break:keep-all}
.seat-slot .trace-note{max-width:236px}
.strip-head{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:8px}
.strip-head .zt{margin:0}
.strip .empty{color:var(--ink-2); font-size:13.5px; margin-top:12px; max-width:44ch; word-break:keep-all}
.slotrow{display:flex; flex-wrap:wrap; gap:6px 22px; margin:0 0 12px; align-items:center}
.slot{display:inline-flex; align-items:center; gap:8px; font-size:13px}
.slot .dots{display:inline-flex; gap:3px}
.slot .dots i{width:12px; height:12px; border:1.5px solid currentColor; display:block}
.slot .dots i.on{background:currentColor}
.slot.t0{color:var(--sp0)} .slot.t1{color:var(--sp1)} .slot.t2{color:var(--sp2)}
.slot .lab{color:var(--ink); font-weight:600}
.slot .cnt{color:var(--ink-3); font-variant-numeric:tabular-nums}
.slot.full .cnt{color:var(--bad); font-weight:600}
.minis{display:flex; flex-wrap:wrap; gap:10px}
.mini{position:relative; width:118px; border:1px solid var(--line-strong); border-radius:12px; background:var(--bg); padding:6px; display:flex; flex-direction:column; gap:4px; text-align:left; cursor:pointer}
.mini:hover{border-color:var(--ink)}
.mini .gx{width:100%; height:auto}
.mini .m-top{display:flex; align-items:baseline; gap:6px; font-size:12px}
.mini .m-no{font-weight:700; font-size:14px; font-variant-numeric:tabular-nums}
.mini.sp0 .m-no,.mini.sp0 .m-t{color:var(--sp0)} .mini.sp1 .m-no,.mini.sp1 .m-t{color:var(--sp1)} .mini.sp2 .m-no,.mini.sp2 .m-t{color:var(--sp2)}
.mini .m-f{font-size:11.5px; color:var(--ink-2)}
.mini .m-tags{display:flex; flex-wrap:wrap; gap:4px}
.tag{padding:0 8px; border-radius:999px; font-size:11px; font-weight:600; line-height:1.6}
.tag.br{background:var(--surface-2); color:var(--ink-2)}
.tag.tr{background:var(--trace-t); color:var(--trace)}
.tag.bad{background:var(--bad-t); color:var(--bad)}

/* 손패와 카드 */
.handzone{margin-top:26px}
.handzone .zt{font-size:14px; font-weight:700; padding-bottom:6px; border-bottom:1px solid var(--line); margin-bottom:14px}
.hand{display:flex; flex-wrap:wrap; gap:12px}
.card{
  position:relative; width:112px; border:1px solid var(--line-strong); border-radius:14px; background:var(--bg);
  display:flex; flex-direction:column; gap:7px; padding:8px; text-align:left; cursor:pointer;
  transition:transform .14s ease, border-color .14s ease;
}
.card:hover{border-color:var(--ink)}
.card .c-top{font-size:12px; line-height:1.35}
.card .c-top b{display:block; font-size:13.5px; font-weight:700; letter-spacing:-0.01em}
.card .c-top i{display:block; font-style:normal; color:var(--ink-2); font-size:11px; word-break:keep-all}
.card .c-big{font-size:25px; font-weight:700; letter-spacing:-0.02em; line-height:1}
.card .c-bot{font-size:11.5px; color:var(--ink-2); line-height:1.4; margin-top:auto; word-break:keep-all}
.card .gx{width:100%; height:auto}
.card.scene.sp0 .c-top i{color:var(--sp0)} .card.scene.sp1 .c-top i{color:var(--sp1)} .card.scene.sp2 .c-top i{color:var(--sp2)}
.card.ctr .c-top b{color:var(--good)}
.card.dist{cursor:default}
.card.dist .c-top b{color:var(--bad)}
.card[aria-pressed="true"]{outline:2px solid var(--accent); outline-offset:2px; transform:translateY(-8px)}
.card.dim{opacity:.62; filter:saturate(.4)}
.card .c-flag{display:inline-block; align-self:flex-start; font-size:11.5px; font-weight:600; line-height:1.35; padding:2px 9px; border-radius:999px; background:var(--ink); color:var(--bg)}
.card .c-flag.warn{background:var(--bad); color:var(--bg)}
.card.hint::after{content:attr(data-hint); position:absolute; top:-10px; right:8px; background:var(--accent); color:var(--accent-ink); font-size:11px; font-weight:600; padding:0 8px; border-radius:999px; z-index:3}
.card.page{width:208px}
.card.page .c-top{display:flex; align-items:baseline; gap:8px; font-size:12.5px}
.card.page .c-no{font-variant-numeric:tabular-nums; font-weight:600}
.card.page .c-type{font-weight:700}
.card.page.sp0 .c-type,.card.page.sp0 .c-no{color:var(--sp0)}
.card.page.sp1 .c-type,.card.page.sp1 .c-no{color:var(--sp1)}
.card.page.sp2 .c-type,.card.page.sp2 .c-no{color:var(--sp2)}
.card .c-text{font-size:13px; line-height:1.7; color:var(--ink); word-break:keep-all}

      '<li><div class="art" aria-hidden="true">' + G.verdict(true) + G.verdict(false) + '</div><div><h3>덮을 때까지</h3><p><b>' + tgt + '점</b>에 닿으면 이겨요. 덱(집중력)이 바닥나면 져요. 어느 쪽이든 쌓은 이야기를 책처럼 이어 읽을 수 있어요.</p></div></li></ol>';

    return h;
  }
  function genreHTML(s) {

    s.genreOptions.forEach(function (gi, k) {

  }
  function tableHTML(s) {

  function endHTML(s) {
    var ending = E.endingName(s), hasFill = s.story.some(function (e) { return e.note || e.fills.some(function (f) { return f && f.trim(); }); });
    var h = '<div class="result"><div class="res-head">' + G.verdict(s.win) + '<div><div class="verdict">' + (s.win ? '이겼어요' : '졌어요') + ' · ' + s.score + '점 / 목표 ' + s.cfg.target + '점 · ' + s.turn + '턴 · 남은 덱 ' + s.deck.length + '장</div><div class="end">' + ending + '</div></div></div>';

    else {

    }

    h += '<textarea id="story-out" readonly hidden spellcheck="false" aria-label="완성된 이야기" style="margin-top:10px;min-height:200px;font-size:15px"></textarea>';

  }
  function endScreen(s) { return statusHTML(s) + castHTML(s) + endHTML(s) + logBox(); }

  /* ---------- 창 (쓰기, 방해, 규칙, 이어 읽기, 새 판 확인) ---------- */
  function headHTML(title, sub, closable) {
    return '<div class="sheet-head"><div><h2 id="dlg-t">' + esc(title) + '</h2>' + (sub ? '<p class="sub">' + sub + '</p>' : '') + '</div>' +
      (closable ? '<button type="button" class="x" id="dlg-x" data-close aria-label="닫기">×</button>' : '') + '</div>';
  }
  function writeSpec(s, i) {
    var e = s.story[i], isNew = P.sheetMode === 'new';
    var sub = isNew ? esc(P.sheetNote) + '<br>빈칸은 직접 채워 써 보세요. 쓰지 않아도 게임은 진행돼요.' : '쓴 글은 바로 저장돼요. 완성된 이야기에도 그대로 이어져요.';
    var go = isNew ? (s.over ? '이야기 보기' : '다음 카드 뽑기') : '닫기';
    return {
      key: 'sheet:' + i + ':' + P.sheetMode, dismiss: true,
      inner: headHTML(isNew ? '방금 읽은 페이지' : (i + 1) + '번째 페이지 쓰기·고치기', sub, true) +
        '<ol class="frags" style="margin-top:10px">' + fragHTML(s, e, i, false) + '</ol>' +
        '<div class="btnrow"><button type="button" class="btn" id="p-sheet-go">' + go + '</button></div>'
    };
  }
  function distSpec(s) {
    var d = s.pending, did = d.did, full = E.distCosts(s, did), tr = E.traceCosts(s, did);
    var rec = P.hint ? E.botDisturb(s, { trace: 'smart' }) : null;
    function isRec(mode, opt) { return rec && rec.mode === mode && rec.opt === opt; }
    var hasCtr = E.counterIndex(s, did) >= 0, hasStory = s.story.length > 0, vuln = s.genre.vuln === did;
    var retN = Math.min(full.ret, s.story.length || full.ret), retT = Math.min(tr.ret, s.story.length || tr.ret);
    var isNew = !seenCards.has(d);
    var h = headHTML(E.DIST_NAMES[did] + ' 방해가 왔어요', (vuln ? '장르 ' + esc(s.genre.name) + '에 취약한 방해라서 비용이 ' + C().vulnPlus + '씩 늘었어요. ' : '') + '하나를 골라 처리해요.', false);
    h += '<div class="dist-panel"><div class="dist-head">' + cardHTML(d, { flip: isNew }) + '<div class="opts" style="flex:1 1 280px;margin-top:0">';
    if (hasCtr) h += '<div class="opt-group"><div class="opt-list"><button type="button" class="opt ctrbtn' + (rec && rec.use ? ' hint' : '') + '" data-dist="counter"><b>' + E.CTR_NAMES[did] + '</b> 카드로 막기<br><span class="help">카드를 버려요. 비용도 흔적도 없어요.</span></button></div></div>';
    h += '<div class="opt-group"><div class="gt">그대로 받기</div><div class="opt-list">' +
      '<button type="button" class="opt' + (isRec('pay', 'score') ? ' hint' : '') + '" data-dist="pay:score">점수 −' + full.score + '</button>' +
      '<button type="button" class="opt' + (isRec('pay', 'deck') ? ' hint' : '') + '" data-dist="pay:deck">덱 −' + full.deck + '장</button>' +
      '<button type="button" class="opt' + (isRec('pay', 'return') ? ' hint' : '') + '" data-dist="pay:return"' + (hasStory ? '' : ' disabled') + '>페이지 ' + retN + '장 반납 (−' + retN * C().pagePts + '점)</button></div></div>';
    h += '<div class="opt-group"><div class="gt">흔적 받기 (비용이 줄고, 다음 페이지에 조건이 붙어요)</div><p class="trace-note">흔적은 방해가 이야기에 남기는 자국이에요. 받으면 비용이 절반으로 줄어요. 대신 다음에 낼 페이지 한 장이 아래 조건을 따라야 하고, 그 페이지에 \'흔적 한 줄\'을 써 넣게 돼요.</p>';
    if (s.trace) h += '<p class="trace-note">이미 흔적이 하나 있어서 새로 받을 수 없어요.</p>';
    else {
      h += '<div class="opt-list">' +
        '<button type="button" class="opt trbtn' + (isRec('trace', 'score') ? ' hint' : '') + '" data-dist="trace:score">점수 −' + tr.score + '</button>' +
        '<button type="button" class="opt trbtn' + (isRec('trace', 'deck') ? ' hint' : '') + '" data-dist="trace:deck">덱 −' + tr.deck + '장</button>' +
        '<button type="button" class="opt trbtn' + (isRec('trace', 'return') ? ' hint' : '') + '" data-dist="trace:return"' + (hasStory ? '' : ' disabled') + '>페이지 ' + retT + '장 반납 (−' + retT * C().pagePts + '점)</button></div>' +
        '<p class="trace-note"><b>쓸 때의 조건</b> ' + E.TRACE_INFO[did].story + '<br><b>게임 규칙</b> ' + E.TRACE_INFO[did].proxy + ' (어기면 −' + C().violationPenalty + '점)</p>';
    }
    h += '</div></div></div><p class="help" style="margin-top:12px"><label class="toggle"><input type="checkbox" data-hint-toggle' + (P.hint ? ' checked' : '') + '>추천 보기</label></p></div>';
    return { key: 'dist:' + P.acts.length, inner: h };
  }
  function layerSpec() {
    var s = P.s;
    if (P.dlg === 'restart') return { key: 'dlg:restart', cls: 'narrow', dismiss: true, inner: headHTML('새 판을 시작할까요?', '지금 하던 판은 사라져요. 쓴 글도 함께 사라지니, 남기고 싶다면 먼저 \'이어 읽기\'에서 복사해 두세요.', true) + '<div class="btnrow"><button type="button" class="btn" id="dlg-yes">새 판 시작</button><button type="button" class="btn ghost" data-close>계속 이어서</button></div>' };
    if (P.dlg === 'rules') return { key: 'dlg:rules', dismiss: true, inner: headHTML('규칙', '', true) + rulesHTML(C()) };
    if (P.dlg === 'book' && s) {
      return { key: 'dlg:book', dismiss: true, inner: headHTML('이어 읽기', '지금까지 쌓은 페이지를 책처럼 이어 읽어요. 빈칸에 쓴 글이 문장 속에 들어가요.', true) +
        '<article class="book" data-book aria-label="지금까지의 이야기">' + bookHTML(s) + '</article>' +
        '<label class="toggle" style="margin-top:12px"><input type="checkbox" id="p-hide"' + (P.hideEmpty ? ' checked' : '') + '>쓰지 않은 칸은 건너뛰고 읽기</label>' +
        '<div class="btnrow"><button type="button" class="btn ghost" id="p-copy">이야기 복사</button><button type="button" class="btn" data-close>닫기</button></div>' +
        '<textarea id="story-out" readonly hidden spellcheck="false" aria-label="지금까지의 이야기" style="margin-top:10px;min-height:160px;font-size:15px"></textarea>' };
    }
    if (s && P.sheet >= 0 && s.story[P.sheet]) return writeSpec(s, P.sheet);
    if (s && s.phase === 'disturbance' && s.pending) return distSpec(s);
    return null;
  }

  /* ---------- 그리기 ---------- */
  function focusKey(el) {
    if (!el || el === document.body || !el.dataset) return '';
    var d = el.dataset;
    if (d.i != null && el.classList.contains('card')) return '.card[data-i="' + d.i + '"]';
    if (d.genre != null) return '[data-genre="' + d.genre + '"]';
    if (d.setting != null) return '[data-setting="' + d.setting + '"]';
    if (d.dist != null) return '[data-dist="' + d.dist + '"]';
    if (d.edit != null) return '[data-edit="' + d.edit + '"]';
    if (d.hintToggle != null) return '[data-hint-toggle]';
    if (el.id) return '#' + el.id;
    return '';
  }
  function render() {
    var s = P.s, key = !P.started ? 'title' : s.phase === 'genre' ? 'genre' : s.phase === 'setting' ? 'setting' : s.over ? 'end' : 'table';
    var fk = focusKey(document.activeElement);
    var oldSheet = $('.sheet'), oldTop = oldSheet ? oldSheet.scrollTop : 0;
    $('#bar').innerHTML = barHTML();
    $('#app').innerHTML = key === 'title' ? titleHTML() : key === 'genre' ? genreHTML(s) : key === 'setting' ? settingHTML(s) : key === 'end' ? endScreen(s) : tableHTML(s);
    var spec = P.started || P.dlg ? layerSpec() : null;
    var layer = $('#layer'), page = $('#page'), root = document.documentElement;
    if (spec) {
      layer.innerHTML = '<div class="ovl" data-key="' + esc(spec.key) + '"><div class="sheet' + (spec.cls ? ' ' + spec.cls : '') + (spec.key === P.layerKey ? ' still' : '') + '" role="dialog" aria-modal="true" aria-labelledby="dlg-t" tabindex="-1">' + spec.inner + '</div></div>';
      page.setAttribute('inert', ''); root.classList.add('lock');
    } else {
      layer.innerHTML = '';
      page.removeAttribute('inert'); root.classList.remove('lock');
    }
    var newLayer = (spec ? spec.key : '') !== P.layerKey;
    P.layerKey = spec ? spec.key : '';
    P.layerDismiss = !!(spec && spec.dismiss);
    if (spec) {
      var sh = $('.sheet', layer);
      if (newLayer) { if (sh) sh.focus({ preventScroll: true }); }
      else if (sh) sh.scrollTop = oldTop;
    }
    if (key !== P.screen) { P.screen = key; try { window.scrollTo(0, 0); } catch (e) { /* 무시 */ } }
    growAll();
    if (fk && !newLayer) { var el = $(fk); if (el && el.focus) { try { el.focus({ preventScroll: true }); } catch (e) { /* 무시 */ } } }
    if (P.started && s) {
      s.hand.forEach(function (c) { seenCards.add(c); });
      if (s.pending) seenCards.add(s.pending);
      P.seatSeen = s.scene ? s.scene.card : null;
      scheduleSave();
    }
  }

  /* ---------- 하는 일 ---------- */
  function afterStep(r) {
    // 한 번 행동한 뒤 새 카드를 뽑아요 (방해가 나오면 창이 떠요)
    applyAct({ k: 'adv' });
    if (r && r.msg) toast(r.msg);
    render();
  }
  function playSelected(kind) {
    var s = P.s, i = P.sel;
    if (i < 0 || !s.hand[i] || s.phase !== 'play') return;
    var c = s.hand[i], k = kind === 'pass' ? 'pass' : (c.t === 'scene' ? 'scene' : 'page');
    var r = applyAct({ k: k, v: i });
    if (!r) return;
    P.sel = -1;
    if (k === 'page') {
      // 읽은 페이지에 바로 써 보게 해요. 창을 닫으면 새 카드를 뽑아요.
      P.sheet = s.story.length - 1; P.sheetMode = 'new'; P.sheetNote = pageSummary(r.info);
      render();
    } else afterStep(r);
  }
  function closeSheet() {
    var s = P.s;
    P.sheet = -1;
    if (s && s.phase === 'draw') applyAct({ k: 'adv' });
    render();
  }
  function closeTop() {
    if (P.dlg) { P.dlg = ''; render(); }
    else if (P.sheet >= 0) closeSheet();
  }
  function selectCard(i) {
    var s = P.s;
    P.sel = (P.sel === i) ? -1 : i;
    $$('#hand .card').forEach(function (el) { el.setAttribute('aria-pressed', String(parseInt(el.dataset.i, 10) === P.sel)); });
    var bar = $('#actionbar');
    if (bar) bar.innerHTML = actionBarHTML(s, hintPlay(s));
  }
  function refreshBook() {
    $$('[data-book]').forEach(function (b) { b.innerHTML = bookHTML(P.s); });
  }
  function copyStory(btn) {
    var ta = $('#story-out'), txt = bookText(P.s), old = btn.textContent;
    ta.value = txt;
    var fail = function () { ta.hidden = false; ta.select(); btn.textContent = '아래 글을 직접 복사해 주세요'; };
    try {
      navigator.clipboard.writeText(txt).then(function () { btn.textContent = '복사했어요'; setTimeout(function () { btn.textContent = old; }, 1500); }, fail);
    } catch (x) { fail(); }
  }

  var downOvl = false;
  document.addEventListener('pointerdown', function (e) { downOvl = !!(e.target.classList && e.target.classList.contains('ovl')); }, true);
  document.addEventListener('click', function (e) {
    var t = e.target, s = P.s;
    if (t.classList && t.classList.contains('ovl')) { if (P.layerDismiss && downOvl) closeTop(); return; }
    var bt = t.closest('button'), id = bt ? bt.id : '';
    if (t.closest('[data-close]')) { closeTop(); return; }
    var gb = t.closest('[data-genre]');
    if (gb && s && s.phase === 'genre') {
      if (applyAct({ k: 'genre', v: parseInt(gb.dataset.genre, 10) })) { P.settingSel = -1; render(); }
      return;
    }
    var sb = t.closest('[data-setting]');
    if (sb && s && s.phase === 'setting') { P.settingSel = parseInt(sb.dataset.setting, 10); render(); return; }
    if (id === 'p-setting-go' && s && s.phase === 'setting' && P.settingSel >= 0) {
      if (applyAct({ k: 'setting', v: P.settingSel, names: { A: P.names.A, B: P.names.B, p1: P.names.p1, p2: P.names.p2 } })) afterStep(null);
      return;
    }
    if (id === 'p-start') { var sv = $('#p-seed'); startGame(sv ? parseInt(sv.value, 10) : NaN); return; }
    if (id === 'p-resume' && P.save) { if (!restore(P.save)) toast('저장된 판을 불러오지 못했어요. 새로 시작해 주세요.'); render(); return; }
    if (id === 'p-restart') { startGame(); return; }
    if (id === 'p-same') { startGame(P.seedUsed); return; }
    if (id === 'b-rules') { P.dlg = 'rules'; render(); return; }
    if (id === 'b-new') {
      if (s && !s.over && P.acts.length > 0) { P.dlg = 'restart'; render(); } else startGame();
      return;
    }
    if (id === 'dlg-yes') { P.dlg = ''; startGame(); return; }
    if (!s) return;
    if (id === 'b-read') { P.dlg = 'book'; render(); return; }
    if (id === 'p-copy') { copyStory(bt); return; }
    if (id === 'p-sheet-go') { closeSheet(); return; }
    var mb = t.closest('[data-edit]');
    if (mb) { P.sheet = parseInt(mb.dataset.edit, 10); P.sheetMode = 'edit'; P.sheetNote = ''; render(); return; }
    var cardBtn = t.closest('.card[data-i]');
    if (cardBtn && s.phase === 'play' && !s.over) { selectCard(parseInt(cardBtn.dataset.i, 10)); return; }
    var ob = t.closest('[data-dist]');
    if (ob && s.phase === 'disturbance' && s.pending && !ob.disabled) {
      var r = applyAct({ k: 'dist', v: ob.dataset.dist });
      if (r) afterStep(r);
      return;
    }
    if (id === 'p-play') { playSelected('play'); return; }
    if (id === 'p-pass') { playSelected('pass'); return; }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.matches && t.matches('[data-hint-toggle]')) { P.hint = t.checked; render(); }
    else if (t.id === 'p-hide') { P.hideEmpty = t.checked; refreshBook(); scheduleSave(); }
  });
  document.addEventListener('toggle', function (e) {
    var d = e.target;
    if (!d || d.tagName !== 'DETAILS') return;
    if (d.dataset.frag != null) P.openFrag[d.dataset.frag] = d.open;
    if (d.id === 'rulebox') P.rulesOpen = d.open;
    if (d.id === 'logbox') P.logOpen = d.open;
    if (d.id === 'edit-details') P.editOpen = d.open;
    if (d.open) growAll();
  }, true);
  document.addEventListener('input', function (e) {
    var t = e.target, d = t.dataset || {};
    if (d.note != null && P.s && P.s.story[d.note]) { P.s.story[d.note].note = t.value; grow(t); refreshBook(); scheduleSave(); }
    else if (d.fill != null && P.s) {
      var pr = d.fill.split(':'), ei = parseInt(pr[0], 10), en = P.s.story[ei];
      if (en) {
        en.fills[parseInt(pr[1], 10)] = t.value;
        [0, 1].forEach(function (w) { $$('[data-sent="' + ei + ':' + w + '"]').forEach(function (el) { el.innerHTML = sentHTML(P.s, ei, w); }); });
        grow(t); refreshBook(); scheduleSave();
      }
    } else if (d.name != null) P.names[d.name] = t.value;
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && P.layerDismiss) { e.preventDefault(); closeTop(); }
  });

  /* ---------- 시작 ---------- */
  var sv0 = lsGet();
  if (sv0 && sv0.v === 1 && Array.isArray(sv0.acts) && typeof sv0.seed === 'number') P.save = sv0;
  window.RR = { state: function () { return P.s; }, acts: function () { return P.acts.slice(); }, hasSave: function () { return !!lsGet(); } };
  render();
})();

</script>
